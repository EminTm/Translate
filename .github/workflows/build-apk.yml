name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # ۱. ساخت خودکار و ۱۰۰٪ استاندارد تمام فایل‌ها و پوشه‌های پروژه
      - name: Generate Complete Clean Project
        run: |
          rm -rf app/src settings.gradle build.gradle gradle.properties local.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FloatingTranslator"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.translator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.translator"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # پوشه‌ها
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/translator

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FloatingTranslator" parent="Theme.MaterialComponents.DayNight.NoActionBar" />
          </resources>
          EOF

          # ic_app_icon.xml (آیکون برنامه)
          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#2196F3"
                  android:pathData="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4Z"/>
          </vector>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp"
              android:background="#F5F5F5">
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="مترجم شناور و صوتی"
                  android:textSize="22sp"
                  android:textStyle="bold"
                  android:textColor="#333333"
                  android:layout_marginBottom="24dp" />
              <Button
                  android:id="@+id/btnStartFloating"
                  android:layout_width="match_parent"
                  android:layout_height="60dp"
                  android:text="فعال‌سازی حالت شناور روی صفحه"
                  android:textSize="16sp" />
          </LinearLayout>
          EOF

          # floating_widget_layout.xml
          cat << 'EOF' > app/src/main/res/layout/floating_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root_container"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">
              <LinearLayout
                  android:id="@+id/layout_collapsed"
                  android:layout_width="60dp"
                  android:layout_height="60dp"
                  android:background="#2196F3"
                  android:gravity="center"
                  android:visibility="visible">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="TR"
                      android:textColor="#FFFFFF"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>
              <LinearLayout
                  android:id="@+id/layout_expanded"
                  android:layout_width="310dp"
                  android:layout_height="wrap_content"
                  android:background="#FFFFFF"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:elevation="8dp"
                  android:visibility="gone">
                  <Button
                      android:id="@+id/btnClose"
                      android:layout_width="35dp"
                      android:layout_height="35dp"
                      android:layout_gravity="end"
                      android:text="✕"
                      android:textSize="12sp" />
                  <EditText
                      android:id="@+id/etInput"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:hint="متن انگلیسی یا صدای فیلم..."
                      android:textSize="14sp"
                      android:maxLines="3" />
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="horizontal"
                      android:layout_marginTop="8dp">
                      <Button
                          android:id="@+id/btnTranslate"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="ترجمه متن"
                          android:textSize="12sp" />
                      <Button
                          android:id="@+id/btnMic"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:layout_marginStart="4dp"
                          android:backgroundTint="#E91E63"
                          android:text="🎙 شنیدن فیلم"
                          android:textSize="12sp" />
                  </LinearLayout>
                  <TextView
                      android:id="@+id/tvResult"
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="10dp"
                      android:padding="8dp"
                      android:background="#E0E0E0"
                      android:text="ترجمه فارسی اینجا نمایش داده می‌شود..."
                      android:textColor="#000000"
                      android:textSize="14sp" />
              </LinearLayout>
          </FrameLayout>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="مترجم شناور"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.FloatingTranslator">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          # TranslatorHelper.kt
          cat << 'EOF' > app/src/main/java/com/example/translator/TranslatorHelper.kt
          package com.example.translator
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object TranslatorHelper {
              suspend fun translate(text: String, from: String = "en", to: String = "fa"): String {
                  return withContext(Dispatchers.IO) {
                      try {
                          val encodedText = URLEncoder.encode(text, "UTF-8")
                          val urlString = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$from&tl=$to&dt=t&q=$encodedText"
                          val url = URL(urlString)
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                          val response = conn.inputStream.bufferedReader().use { it.readText() }
                          val jsonArray = JSONArray(response)
                          val sentences = jsonArray.getJSONArray(0)
                          val result = StringBuilder()
                          for (i in 0 until sentences.length()) {
                              result.append(sentences.getJSONArray(i).getString(0))
                          }
                          result.toString()
                      } catch (e: Exception) {
                          "خطا در اتصال به سرور ترجمه"
                      }
                  }
              }
          }
          EOF

          # FloatingWidgetService.kt
          cat << 'EOF' > app/src/main/java/com/example/translator/FloatingWidgetService.kt
          package com.example.translator
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.*
          import android.speech.*
          import android.view.*
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.util.*
          import kotlin.math.abs

          class FloatingWidgetService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams
              private var speechRecognizer: SpeechRecognizer? = null

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.floating_widget_layout, null)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 50
                      y = 150
                  }

                  windowManager.addView(floatingView, params)
                  setupFloatingLogic()
              }

              private fun setupFloatingLogic() {
                  val collapsed = floatingView.findViewById<View>(R.id.layout_collapsed)
                  val expanded = floatingView.findViewById<View>(R.id.layout_expanded)
                  val btnClose = floatingView.findViewById<Button>(R.id.btnClose)
                  val btnTranslate = floatingView.findViewById<Button>(R.id.btnTranslate)
                  val btnMic = floatingView.findViewById<Button>(R.id.btnMic)
                  val etInput = floatingView.findViewById<EditText>(R.id.etInput)
                  val tvResult = floatingView.findViewById<TextView>(R.id.tvResult)

                  collapsed.setOnClickListener {
                      collapsed.visibility = View.GONE
                      expanded.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnClose.setOnClickListener {
                      expanded.visibility = View.GONE
                      collapsed.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnTranslate.setOnClickListener {
                      val text = etInput.text.toString().trim()
                      if (text.isNotEmpty()) {
                          tvResult.text = "در حال ترجمه..."
                          CoroutineScope(Dispatchers.Main).launch {
                              tvResult.text = TranslatorHelper.translate(text)
                          }
                      }
                  }

                  btnMic.setOnClickListener {
                      startListening(etInput, tvResult)
                  }

                  setupDrag(collapsed)
              }

              private fun startListening(etInput: EditText, tvResult: TextView) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      Toast.makeText(this, "موتور تشخیص گفتار فعال نیست", Toast.LENGTH_SHORT).show()
                      return
                  }
                  speechRecognizer?.destroy()
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)

                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US")
                  }

                  speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { tvResult.text = "در حال شنیدن صدای فیلم..." }
                      override fun onResults(results: Bundle?) {
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              val heardText = matches[0]
                              etInput.setText(heardText)
                              CoroutineScope(Dispatchers.Main).launch {
                                  tvResult.text = "در حال ترجمه..."
                                  tvResult.text = TranslatorHelper.translate(heardText)
                              }
                          }
                      }
                      override fun onError(error: Int) { tvResult.text = "صدا تشخیص داده نشد." }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  speechRecognizer?.startListening(intent)
              }

              private fun setupDrag(view: View) {
                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(floatingView, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - initialTouchX) < 10 && abs(event.rawY - initialTouchY) < 10) {
                                  view.performClick()
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "floating_translator_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "مترجم شناور", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("مترجم شناور فعال است")
                      .setContentText("روی حباب صفحه کلیک کنید")
                      .setSmallIcon(R.drawable.ic_app_icon)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, notification)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  speechRecognizer?.destroy()
                  if (::floatingView.isInitialized) windowManager.removeView(floatingView)
              }
          }
          EOF

          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/translator/MainActivity.kt
          package com.example.translator
          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  findViewById<Button>(R.id.btnStartFloating).setOnClickListener {
                      checkPermissionsAndStart()
                  }
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                      Toast.makeText(this, "دسترسی نمایش روی برنامه‌ها را فعال کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                      return
                  }
                  val serviceIntent = Intent(this, FloatingWidgetService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  finish()
              }
          }
          EOF

      # ۲. تایید خودکار لایسنس‌های اندروید
      - name: Accept Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # ۳. بیلد پروژه
      - name: Build APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # ۴. دانلود مستقیم فایل نهایی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Floating-Translator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
