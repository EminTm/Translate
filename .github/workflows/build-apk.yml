name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Clean Project
        run: |
          rm -rf app/src settings.gradle build.gradle gradle.properties local.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GoogleTranslateAI"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.translator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.translator"
                  minSdk 24
                  targetSdk 34
                  versionCode 5
                  versionName "5.0-Ultimate"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlin {
                  jvmToolchain(17)
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # پوشه‌ها
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/translator

          # themes.xml (تم مشکی گوگلی)
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.GoogleTranslateAI" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#A8C7FA</item>
                  <item name="colorPrimaryVariant">#0F1015</item>
                  <item name="colorOnPrimary">#003258</item>
                  <item name="android:statusBarColor">#0F1015</item>
                  <item name="android:navigationBarColor">#0F1015</item>
              </style>
          </resources>
          EOF

          # اشکال گرافیکی مدرن Material 3
          cat << 'EOF' > app/src/main/res/drawable/bg_dark_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1C22" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#24262E" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#363942" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_lang_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1F2128" />
              <corners android:radius="16dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_button.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#1F2128" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_mic_fab.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#A8C7FA" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#A8C7FA" />
              <stroke android:width="2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_window.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1C22" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#363942" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#A8C7FA"
                  android:pathData="M12.87,15.07l-2.54,-2.51.03,-.03c1.74,-1.94 2.98,-4.17 3.71,-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5,7.92 10.44,9.75 9,11.35 8.07,10.32 7.3,9.19 6.69,8h-2c.73,1.63 1.73,3.17 2.98,4.56l-5.11,5.02L4,19l5,-5 3.11,3.11.76,-2.04zM18.5,10h-2L12,22h2l1.12,-3h4.75L21,22h2l-4.5,-12zm-2.62,7l1.62,-4.33L19.12,17h-3.24z"/>
          </vector>
          EOF

          # activity_main.xml (رابط کاربری تاریک مطابق عکس)
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F1015"
              android:paddingHorizontal="16dp"
              android:paddingTop="16dp"
              android:paddingBottom="24dp">

              <!-- نوار بالا: ستاره، عنوان ترنسلیت، آیکون کلید AI -->
              <RelativeLayout
                  android:id="@+id/layoutTopBar"
                  android:layout_width="match_parent"
                  android:layout_height="48dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_centerVertical="true"
                      android:text="★"
                      android:textColor="#E2E2E6"
                      android:textSize="22sp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:text="Google Translate"
                      android:textColor="#E2E2E6"
                      android:textSize="19sp"
                      android:textStyle="bold" />

                  <TextView
                      android:id="@+id/btnSettingsKey"
                      android:layout_width="38dp"
                      android:layout_height="38dp"
                      android:layout_alignParentEnd="true"
                      android:layout_centerVertical="true"
                      android:background="@drawable/bg_circle_button"
                      android:gravity="center"
                      android:text="⚙"
                      android:textColor="#A8C7FA"
                      android:textSize="18sp" />
              </RelativeLayout>

              <!-- محتوای وسط: ورود متن، پیست و نتیجه ترجمه -->
              <ScrollView
                  android:id="@+id/scrollArea"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/layoutBottomSection"
                  android:layout_below="@id/layoutTopBar"
                  android:layout_marginTop="16dp"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <EditText
                          android:id="@+id/etTranslateInput"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:minHeight="90dp"
                          android:background="@null"
                          android:gravity="top|start"
                          android:hint="Translate text"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#6C707A"
                          android:textSize="24sp" />

                      <!-- دکمه Paste کپسولی -->
                      <LinearLayout
                          android:id="@+id/btnPasteChip"
                          android:layout_width="wrap_content"
                          android:layout_height="38dp"
                          android:layout_marginTop="6dp"
                          android:background="@drawable/bg_chip"
                          android:gravity="center_vertical"
                          android:paddingHorizontal="16dp">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="📋  Paste"
                              android:textColor="#E2E2E6"
                              android:textSize="14sp"
                              android:textStyle="bold" />
                      </LinearLayout>

                      <!-- کارت نتیجه ترجمه -->
                      <LinearLayout
                          android:id="@+id/cardResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="20dp"
                          android:background="@drawable/bg_dark_card"
                          android:orientation="vertical"
                          android:padding="16dp"
                          android:visibility="gone">

                          <TextView
                              android:id="@+id/tvTranslationResult"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#A8C7FA"
                              android:textSize="18sp"
                              android:lineSpacingExtra="4dp" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:gravity="end"
                              android:layout_marginTop="12dp">

                              <Button
                                  android:id="@+id/btnCopyResult"
                                  android:layout_width="wrap_content"
                                  android:layout_height="34dp"
                                  android:backgroundTint="#24262E"
                                  android:text="کپی متن"
                                  android:textColor="#E2E2E6"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>

              <!-- بخش کنترل پایین: زبان‌ها و دکمه‌های اکشن -->
              <LinearLayout
                  android:id="@+id/layoutBottomSection"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical">

                  <!-- نوار انتخاب دو زبانه -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnSourceLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Turkish"
                          android:textColor="#E2E2E6"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <ImageView
                          android:id="@+id/btnSwapLang"
                          android:layout_width="44dp"
                          android:layout_height="44dp"
                          android:padding="10dp"
                          android:src="@android:drawable/ic_popup_sync" />

                      <TextView
                          android:id="@+id/btnTargetLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Persian"
                          android:textColor="#E2E2E6"
                          android:textSize="15sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- سه دکمه اصلی: شناور، میکروفون، ضبط صدای داخلی گوشی -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="18dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <!-- دکمه پنجره شناور -->
                      <LinearLayout
                          android:id="@+id/btnToggleFloating"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:background="@drawable/bg_circle_button"
                              android:gravity="center"
                              android:text="🪟"
                              android:textSize="22sp" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:text="شناور"
                              android:textColor="#A0A4AE"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <!-- دکمه بزرگ میکروفون اصلی (گفتار شما) -->
                      <LinearLayout
                          android:id="@+id/btnMainMic"
                          android:layout_width="74dp"
                          android:layout_height="74dp"
                          android:background="@drawable/bg_mic_fab"
                          android:elevation="6dp"
                          android:gravity="center">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="🎙"
                              android:textSize="28sp" />
                      </LinearLayout>

                      <!-- دکمه ضبط صدای در حال پخش از خود گوشی (فیلم/اینستاگرام) -->
                      <LinearLayout
                          android:id="@+id/btnInternalAudio"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:background="@drawable/bg_circle_button"
                              android:gravity="center"
                              android:text="🔊"
                              android:textSize="22sp" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:text="صدای فیلم"
                              android:textColor="#A0A4AE"
                              android:textSize="12sp" />
                      </LinearLayout>

                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

          # floating_widget_layout.xml (ویجت شناور هماهنگ با تم تیره)
          cat << 'EOF' > app/src/main/res/layout/floating_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root_container"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">

              <!-- حباب شناور -->
              <LinearLayout
                  android:id="@+id/layout_collapsed"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:background="@drawable/bg_bubble"
                  android:gravity="center"
                  android:elevation="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="GT"
                      android:textColor="#003258"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <!-- پنجره بازشده -->
              <LinearLayout
                  android:id="@+id/layout_expanded"
                  android:layout_width="330dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_window"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:elevation="12dp"
                  android:visibility="gone">

                  <LinearLayout
                      android:id="@+id/layout_header_drag"
                      android:layout_width="match_parent"
                      android:layout_height="36dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="Google Translate AI"
                          android:textColor="#A8C7FA"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/btnMinimize"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:gravity="center"
                          android:text="—"
                          android:textColor="#9AA0A6"
                          android:textSize="15sp" />

                      <TextView
                          android:id="@+id/btnCloseApp"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:gravity="center"
                          android:text="✕"
                          android:textColor="#F28B82"
                          android:textSize="15sp" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="6dp"
                      android:background="@drawable/bg_dark_card"
                      android:orientation="vertical"
                      android:padding="8dp">

                      <EditText
                          android:id="@+id/etInput"
                          android:layout_width="match_parent"
                          android:layout_height="64dp"
                          android:background="@null"
                          android:gravity="top|start"
                          android:hint="تایپ یا ضبط گفتار..."
                          android:textSize="13sp"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#6C707A" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="36dp"
                          android:gravity="end|center_vertical"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnMic"
                              android:layout_width="wrap_content"
                              android:layout_height="32dp"
                              android:backgroundTint="#A8C7FA"
                              android:textColor="#003258"
                              android:text="🎙 گفتار"
                              android:textSize="11sp" />

                          <Button
                              android:id="@+id/btnTranslate"
                              android:layout_width="wrap_content"
                              android:layout_height="32dp"
                              android:layout_marginStart="6dp"
                              android:backgroundTint="#24262E"
                              android:textColor="#E2E2E6"
                              android:text="ترجمه"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <ScrollView
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:maxHeight="110dp"
                      android:layout_marginTop="8dp">

                      <TextView
                          android:id="@+id/tvResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:textColor="#A8C7FA"
                          android:textSize="13sp"
                          android:text="ترجمه اینجا نمایش داده می‌شود..." />
                  </ScrollView>
              </LinearLayout>
          </FrameLayout>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="Translate AI"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:supportsRtl="false"
                  android:theme="@style/Theme.GoogleTranslateAI">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone|mediaProjection" />
              </application>
          </manifest>
          EOF

          # TranslatorHelper.kt (پشتیبانی از ترجمه سریع و تحلیل صوت با هوش مصنوعی Gemini)
          cat << 'EOF' > app/src/main/java/com/example/translator/TranslatorHelper.kt
          package com.example.translator

          import android.util.Base64
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object TranslatorHelper {

              suspend fun translate(text: String, from: String, to: String): String {
                  return withContext(Dispatchers.IO) {
                      var conn: HttpURLConnection? = null
                      try {
                          val encodedText = URLEncoder.encode(text, "UTF-8")
                          val urlString = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$from&tl=$to&dt=t&q=$encodedText"
                          conn = URL(urlString).openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.connectTimeout = 8000
                          conn.readTimeout = 8000
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0")

                          val response = conn.inputStream.bufferedReader().use { it.readText() }
                          val jsonArray = JSONArray(response)
                          val sentences = jsonArray.getJSONArray(0)
                          val result = StringBuilder()
                          for (i in 0 until sentences.length()) {
                              result.append(sentences.getJSONArray(i).getString(0))
                          }
                          result.toString()
                      } catch (e: Exception) {
                          "خطا در ترجمه: ${e.localizedMessage}"
                      } finally {
                          conn?.disconnect()
                      }
                  }
              }

              // ارسال مستقیم فایل صوتی ضبط شده از سیستم گوشی به Gemini جهت تبدیل به متن و ترجمه
              suspend fun transcribeAndTranslateInternalAudio(wavBytes: ByteArray, targetLang: String, apiKey: String): String {
                  return withContext(Dispatchers.IO) {
                      var conn: HttpURLConnection? = null
                      try {
                          val base64Audio = Base64.encodeToString(wavBytes, Base64.NO_WRAP)
                          val prompt = "This is an internal audio clip recorded directly from a video/media on the phone. " +
                                  "1. Accurately transcribe what is being spoken.\n" +
                                  "2. Translate it into $targetLang.\n" +
                                  "Provide a clean output with the transcript and translation."

                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey")
                          conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.connectTimeout = 20000
                          conn.readTimeout = 25000
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val root = JSONObject().apply {
                              put("contents", JSONArray().apply {
                                  put(JSONObject().apply {
                                      put("parts", JSONArray().apply {
                                          put(JSONObject().apply { put("text", prompt) })
                                          put(JSONObject().apply {
                                              put("inline_data", JSONObject().apply {
                                                  put("mime_type", "audio/wav")
                                                  put("data", base64Audio)
                                              })
                                          })
                                      })
                                  })
                              })
                          }

                          conn.outputStream.use { it.write(root.toString().toByteArray(Charsets.UTF_8)) }

                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              json.getJSONArray("candidates")
                                  .getJSONObject(0)
                                  .getJSONObject("content")
                                  .getJSONArray("parts")
                                  .getJSONObject(0)
                                  .getString("text").trim()
                          } else {
                              "خطای هوش مصنوعی (کد ${conn.responseCode}). کلید API را چک کنید."
                          }
                      } catch (e: Exception) {
                          "خطا در تحلیل صدا: ${e.localizedMessage}"
                      } finally {
                          conn?.disconnect()
                      }
                  }
              }

              // تولید هدر WAV برای استریم صوتی خام PCM
              fun pcmToWav(pcmData: ByteArray, sampleRate: Int = 16000, channels: Int = 1): ByteArray {
                  val totalAudioLen = pcmData.size
                  val totalDataLen = totalAudioLen + 36
                  val byteRate = sampleRate * channels * 2
                  val header = ByteArray(44)
                  header[0] = 'R'.code.toByte(); header[1] = 'I'.code.toByte(); header[2] = 'F'.code.toByte(); header[3] = 'F'.code.toByte()
                  header[4] = (totalDataLen and 0xff).toByte()
                  header[5] = ((totalDataLen shr 8) and 0xff).toByte()
                  header[6] = ((totalDataLen shr 16) and 0xff).toByte()
                  header[7] = ((totalDataLen shr 24) and 0xff).toByte()
                  header[8] = 'W'.code.toByte(); header[9] = 'A'.code.toByte(); header[10] = 'V'.code.toByte(); header[11] = 'E'.code.toByte()
                  header[12] = 'f'.code.toByte(); header[13] = 'm'.code.toByte(); header[14] = 't'.code.toByte(); header[15] = ' '.code.toByte()
                  header[16] = 16; header[17] = 0; header[18] = 0; header[19] = 0
                  header[20] = 1; header[21] = 0 // PCM
                  header[22] = channels.toByte(); header[23] = 0
                  header[24] = (sampleRate and 0xff).toByte()
                  header[25] = ((sampleRate shr 8) and 0xff).toByte()
                  header[26] = ((sampleRate shr 16) and 0xff).toByte()
                  header[27] = ((sampleRate shr 24) and 0xff).toByte()
                  header[28] = (byteRate and 0xff).toByte()
                  header[29] = ((byteRate shr 8) and 0xff).toByte()
                  header[30] = ((byteRate shr 16) and 0xff).toByte()
                  header[31] = ((byteRate shr 24) and 0xff).toByte()
                  header[32] = (channels * 2).toByte(); header[33] = 0
                  header[34] = 16; header[35] = 0
                  header[36] = 'd'.code.toByte(); header[37] = 'a'.code.toByte(); header[38] = 't'.code.toByte(); header[39] = 'a'.code.toByte()
                  header[40] = (totalAudioLen and 0xff).toByte()
                  header[41] = ((totalAudioLen shr 8) and 0xff).toByte()
                  header[42] = ((totalAudioLen shr 16) and 0xff).toByte()
                  header[43] = ((totalAudioLen shr 24) and 0xff).toByte()
                  return header + pcmData
              }
          }
