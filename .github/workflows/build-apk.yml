              private fun checkNotificationPermission() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED) {
                          postNotificationLauncher.launch(Manifest.permission.POST_NOTIFICATIONS)
                      }
                  }
              }

              override fun onResume() {
                  super.onResume()
                  val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                  sourceLang = prefs.getString("source_lang", sourceLang) ?: sourceLang
                  targetLang = prefs.getString("target_lang", targetLang) ?: targetLang
                  btnSourceLang.text = sourceLang
                  btnTargetLang.text = targetLang
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech?.language = Locale("fa")
                  }
              }

              private fun speakTranslatedText() {
                  val text = tvResult.text.toString().trim()
                  if (text.isEmpty() || text.startsWith("در حال") || text.startsWith("خطا")) {
                      Toast.makeText(this, "متنی برای پخش با اسپیکر وجود ندارد", Toast.LENGTH_SHORT).show()
                      return
                  }
                  val trgCode = translateCodes[targetLang] ?: "fa"
                  val locale = when (trgCode) {
                      "en" -> Locale.ENGLISH
                      "tr" -> Locale("tr", "TR")
                      "de" -> Locale.GERMAN
                      "fr" -> Locale.FRENCH
                      "ru" -> Locale("ru", "RU")
                      "ar" -> Locale("ar")
                      else -> Locale("fa")
                  }
                  textToSpeech?.language = locale
                  textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "TTS_ID")
              }

              private fun handlePaste() {
                  val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val text = clip.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                  if (text.isNotBlank()) {
                      etInput.setText(text)
                      performTranslation(text)
                  } else {
                      Toast.makeText(this, "متنی در حافظه کپی نشده است", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun performTranslation(text: String) {
                  cardResult.visibility = View.VISIBLE
                  tvResult.text = "در حال ترجمه..."
                  val src = translateCodes[sourceLang] ?: "auto"
                  val trg = translateCodes[targetLang] ?: "fa"
                  CoroutineScope(Dispatchers.Main).launch {
                      tvResult.text = TranslatorHelper.translate(text, src, trg)
                  }
              }

              private fun swapLanguages() {
                  val temp = sourceLang
                  sourceLang = targetLang
                  targetLang = temp
                  btnSourceLang.text = sourceLang
                  btnTargetLang.text = targetLang

                  getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                      .edit().putString("source_lang", sourceLang).putString("target_lang", targetLang).apply()

                  val currentText = etInput.text.toString().trim()
                  if (currentText.isNotEmpty()) performTranslation(currentText)
              }

              private fun showLanguagePicker(isSource: Boolean) {
                  AlertDialog.Builder(this)
                      .setTitle("انتخاب زبان")
                      .setItems(languages.toTypedArray()) { _, which ->
                          if (isSource) {
                              sourceLang = languages[which]
                              btnSourceLang.text = sourceLang
                          } else {
                              targetLang = languages[which]
                              btnTargetLang.text = targetLang
                          }
                          getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                              .edit().putString("source_lang", sourceLang).putString("target_lang", targetLang).apply()

                          val currentText = etInput.text.toString().trim()
                          if (currentText.isNotEmpty()) performTranslation(currentText)
                      }.show()
              }

              private fun checkOverlayAndStartService() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      Toast.makeText(this, "لطفاً دسترسی پنجره شناور را تایید کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      micForFloatingLauncher.launch(Manifest.permission.RECORD_AUDIO)
                      return
                  }
                  launchFloatingServiceDirectly()
              }

              private fun launchFloatingServiceDirectly() {
                  val intent = Intent(this, FloatingWidgetService::class.java)
                  startForegroundService(intent)
                  Toast.makeText(this, "پنجره شناور فعال شد", Toast.LENGTH_SHORT).show()
              }

              private fun checkMicAndListen() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      micForMainAppLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  } else {
                      startListeningAudio()
                  }
              }

              private fun startListeningAudio() {
                  val speechTag = speechCodes[sourceLang] ?: "tr-TR"
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, speechTag)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, speechTag)
                      putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf(speechTag))
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "در حال شنیدن گفتار شما...")
                  }

                  try {
                      speechIntentLauncher.launch(intent)
                  } catch (e: Exception) {
                      speechRecognizer?.destroy()
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              cardResult.visibility = View.VISIBLE
                              tvResult.text = "در حال شنیدن گفتار..."
                          }
                          override fun onResults(results: Bundle?) {
                              val heard = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.getOrNull(0) ?: ""
                              if (heard.isNotEmpty()) {
                                  etInput.setText(heard)
                                  performTranslation(heard)
                              }
                          }
                          override fun onError(error: Int) {
                              tvResult.text = "خطا در دریافت صدا: کد $error"
                          }
                          override fun onBeginningOfSpeech() {}
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {}
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })
                      speechRecognizer?.startListening(intent)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  textToSpeech?.stop()
                  textToSpeech?.shutdown()
                  speechRecognizer?.destroy()
              }
          }
