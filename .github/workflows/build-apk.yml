name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Clean Project
        run: |
          rm -rf app/src settings.gradle build.gradle gradle.properties local.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "FloatingTranslator"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.translator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.translator"
                  minSdk 24
                  targetSdk 34
                  versionCode 3
                  versionName "3.0-AI"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          # ساخت پوشه‌ها
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/translator

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.FloatingTranslator" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#1A73E8</item>
                  <item name="colorPrimaryVariant">#1557B0</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
              </style>
          </resources>
          EOF

          # bg_bubble.xml (آیکون حباب شناور)
          cat << 'EOF' > app/src/main/res/drawable/bg_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#1A73E8" />
              <stroke android:width="2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          # bg_window.xml (کادر پنجره شناور)
          cat << 'EOF' > app/src/main/res/drawable/bg_window.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#F8F9FA" />
              <corners android:radius="18dp" />
              <stroke android:width="1dp" android:color="#DADCE0" />
          </shape>
          EOF

          # bg_card.xml
          cat << 'EOF' > app/src/main/res/drawable/bg_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#FFFFFF" />
              <corners android:radius="12dp" />
              <stroke android:width="1dp" android:color="#E0E2E6" />
          </shape>
          EOF

          # ic_app_icon.xml
          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
