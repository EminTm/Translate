          cat << 'EOF' > app/src/main/java/com/example/translator/FloatingWidgetService.kt
          package com.example.translator

          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.*
          import android.speech.tts.TextToSpeech
          import android.view.*
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.util.*
          import kotlin.math.abs

          class FloatingWidgetService : Service(), TextToSpeech.OnInitListener {

              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams
              private var textToSpeech: TextToSpeech? = null
              private val serviceScope = CoroutineScope(Dispatchers.Main + SupervisorJob())

              private val languages = listOf("Turkish", "Persian", "English", "Arabic", "Russian", "German", "French")
              
              private val translateCodes = mapOf(
                  "Turkish" to "tr", "Persian" to "fa", "English" to "en",
                  "Arabic" to "ar", "Russian" to "ru", "German" to "de", "French" to "fr"
              )

              private val speechCodes = mapOf(
                  "Turkish" to "tr-TR", "Persian" to "fa-IR", "English" to "en-US",
                  "Arabic" to "ar-SA", "Russian" to "ru-RU", "German" to "de-DE", "French" to "fr-FR"
              )

              private var sourceLang = "Turkish"
              private var targetLang = "Persian"

              private lateinit var btnFloatSourceLang: TextView
              private lateinit var btnFloatTargetLang: TextView
              private lateinit var etInput: EditText
              private lateinit var tvResult: TextView
              private lateinit var layoutCollapsed: View
              private lateinit var layoutExpanded: View

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startServiceNotification()

                  textToSpeech = TextToSpeech(this, this)

                  val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                  sourceLang = prefs.getString("source_lang", "Turkish") ?: "Turkish"
                  targetLang = prefs.getString("target_lang", "Persian") ?: "Persian"

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.floating_widget_layout, null)

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 60
                      y = 200
                  }

                  windowManager.addView(floatingView, params)
                  setupFloatingLogic()
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startServiceNotification()

                  when (intent?.action) {
                      ACTION_VOICE_RESULT -> {
                          val text = intent.getStringExtra(EXTRA_VOICE_TEXT) ?: ""
                          restoreExpandedWindow()
                          if (text.isNotBlank() && ::etInput.isInitialized) {
                              etInput.setText(text)
                              performTranslation(text)
                          }
                      }
                      ACTION_VOICE_CANCEL -> {
                          restoreExpandedWindow()
                      }
                  }
                  return START_STICKY
              }

              private fun restoreExpandedWindow() {
                  if (::layoutCollapsed.isInitialized && ::layoutExpanded.isInitialized) {
                      layoutCollapsed.visibility = View.GONE
                      layoutExpanded.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                      windowManager.updateViewLayout(floatingView, params)
                  }
              }

              override fun onInit(status: Int) {
                  if (status == TextToSpeech.SUCCESS) {
                      textToSpeech?.language = Locale("fa")
                  }
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFloatingLogic() {
                  layoutCollapsed = floatingView.findViewById(R.id.layout_collapsed)
                  layoutExpanded = floatingView.findViewById(R.id.layout_expanded)
                  val headerDrag = floatingView.findViewById<View>(R.id.layout_header_drag)
                  val btnMinimize = floatingView.findViewById<TextView>(R.id.btnMinimize)
                  val btnCloseApp = floatingView.findViewById<TextView>(R.id.btnCloseApp)
                  etInput = floatingView.findViewById(R.id.etInput)
                  val btnTranslate = floatingView.findViewById<Button>(R.id.btnTranslate)
                  val btnMic = floatingView.findViewById<Button>(R.id.btnMic)
                  tvResult = floatingView.findViewById(R.id.tvResult)

                  btnFloatSourceLang = floatingView.findViewById(R.id.btnFloatSourceLang)
                  btnFloatTargetLang = floatingView.findViewById(R.id.btnFloatTargetLang)
                  val btnFloatSwapLang = floatingView.findViewById<TextView>(R.id.btnFloatSwapLang)
                  val btnFloatSpeak = floatingView.findViewById<TextView>(R.id.btnFloatSpeak)
                  val btnFloatCopy = floatingView.findViewById<TextView>(R.id.btnFloatCopy)

                  btnFloatSourceLang.text = sourceLang
                  btnFloatTargetLang.text = targetLang

                  btnFloatSourceLang.setOnClickListener { showFloatingLanguagePicker(true) }
                  btnFloatTargetLang.setOnClickListener { showFloatingLanguagePicker(false) }

                  btnFloatSwapLang.setOnClickListener {
                      val temp = sourceLang
                      sourceLang = targetLang
                      targetLang = temp
                      btnFloatSourceLang.text = sourceLang
                      btnFloatTargetLang.text = targetLang

                      getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                          .edit().putString("source_lang", sourceLang).putString("target_lang", targetLang).apply()

                      val text = etInput.text.toString().trim()
                      if (text.isNotEmpty()) performTranslation(text)
                  }

                  btnFloatSpeak.setOnClickListener {
                      val text = tvResult.text.toString().trim()
                      if (text.isNotEmpty() && !text.startsWith("در حال") && !text.startsWith("خطا")) {
                          val trgCode = translateCodes[targetLang] ?: "fa"
                          val locale = when (trgCode) {
                              "en" -> Locale.ENGLISH
                              "tr" -> Locale("tr", "TR")
                              "de" -> Locale.GERMAN
                              "fr" -> Locale.FRENCH
                              "ru" -> Locale("ru", "RU")
                              "ar" -> Locale("ar")
                              else -> Locale("fa")
                          }
                          textToSpeech?.language = locale
                          textToSpeech?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "FLOAT_TTS")
                      }
                  }

                  btnFloatCopy.setOnClickListener {
                      val text = tvResult.text.toString().trim()
                      if (text.isNotEmpty()) {
                          val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clip.setPrimaryClip(ClipData.newPlainText("Translation", text))
                          Toast.makeText(this, "متن کپی شد", Toast.LENGTH_SHORT).show()
                      }
                  }

                  layoutCollapsed.setOnClickListener {
                      layoutCollapsed.visibility = View.GONE
                      layoutExpanded.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnMinimize.setOnClickListener {
                      layoutExpanded.visibility = View.GONE
                      layoutCollapsed.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnCloseApp.setOnClickListener {
                      stopSelf()
                  }

                  btnTranslate.setOnClickListener {
                      val text = etInput.text.toString().trim()
                      if (text.isNotEmpty()) {
                          performTranslation(text)
                      }
                  }

                  btnMic.setOnClickListener {
                      // برای جلوگیری از تداخل فوکوس و قفل شدن میکروفون توسط سیستم در اندروید ۱۰ به بالا
                      layoutExpanded.visibility = View.GONE
                      layoutCollapsed.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      windowManager.updateViewLayout(floatingView, params)

                      val intent = Intent(this, VoiceInputActivity::class.java).apply {
                          addFlags(Intent.FLAG_ACTIVITY_NEW_TASK or Intent.FLAG_ACTIVITY_CLEAR_TOP)
                          putExtra(VoiceInputActivity.EXTRA_SPEECH_TAG, speechCodes[sourceLang] ?: "tr-TR")
                          putExtra(VoiceInputActivity.EXTRA_LANG_NAME, sourceLang)
                      }
                      startActivity(intent)
                  }

                  attachDragListener(layoutCollapsed)
                  attachDragListener(headerDrag)
              }

              private fun performTranslation(text: String) {
                  tvResult.text = "در حال ترجمه..."
                  val src = translateCodes[sourceLang] ?: "auto"
                  val trg = translateCodes[targetLang] ?: "fa"
                  serviceScope.launch {
                      tvResult.text = TranslatorHelper.translate(text, src, trg)
                  }
              }

              private fun showFloatingLanguagePicker(isSource: Boolean) {
                  val contextWrapper = android.view.ContextThemeWrapper(this, android.R.style.Theme_DeviceDefault_Dialog_Alert)
                  val builder = AlertDialog.Builder(contextWrapper)
                  builder.setTitle(if (isSource) "انتخاب زبان مبدا" else "انتخاب زبان مقصد")
                  builder.setItems(languages.toTypedArray()) { _, which ->
                      if (isSource) {
                          sourceLang = languages[which]
                          btnFloatSourceLang.text = sourceLang
                      } else {
                          targetLang = languages[which]
                          btnFloatTargetLang.text = targetLang
                      }
                      getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                          .edit().putString("source_lang", sourceLang).putString("target_lang", targetLang).apply()

                      val text = etInput.text.toString().trim()
                      if (text.isNotEmpty()) performTranslation(text)
                  }
                  val dialog = builder.create()
                  dialog.window?.setType(WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY)
                  dialog.show()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun attachDragListener(view: View) {
                  var initialX = 0; var initialY = 0
                  var initialTouchX = 0f; var initialTouchY = 0f
                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x; initialY = params.y
                              initialTouchX = event.rawX; initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(floatingView, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - initialTouchX) < 10 && abs(event.rawY - initialTouchY) < 10) {
                                  view.performClick()
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun startServiceNotification() {
                  val channelId = "floating_emin_ch"
                  val channel = NotificationChannel(channelId, "Emin Translate Floating", NotificationManager.IMPORTANCE_LOW)
                  getSystemService(NotificationManager::class.java)?.createNotificationChannel(channel)

                  val notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("Emin Translate")
                      .setContentText("پنجره شناور فعال است")
                      .setSmallIcon(R.drawable.ic_app_icon)
                      .setPriority(NotificationCompat.PRIORITY_LOW)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.UPSIDE_DOWN_CAKE) {
                      startForeground(1001, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1001, notification)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  serviceScope.cancel()
                  textToSpeech?.stop()
                  textToSpeech?.shutdown()
                  if (::floatingView.isInitialized) {
                      windowManager.removeView(floatingView)
                  }
              }

              companion object {
                  const val ACTION_VOICE_RESULT = "com.example.translator.ACTION_VOICE_RESULT"
                  const val ACTION_VOICE_CANCEL = "com.example.translator.ACTION_VOICE_CANCEL"
                  const val EXTRA_VOICE_TEXT = "extra_voice_text"
              }
          }
