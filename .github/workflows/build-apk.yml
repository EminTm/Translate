          package com.example.translator

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Bundle
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.widget.Button
          import android.widget.TextView
          import android.widget.Toast
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class VoiceInputActivity : AppCompatActivity() {

              private var speechRecognizer: SpeechRecognizer? = null
              private lateinit var tvStatus: TextView
              private lateinit var tvLang: TextView
              private var speechLangTag: String = "tr-TR"

              private val micPermissionLauncher = registerForActivityResult(
                  ActivityResultContracts.RequestPermission()
              ) { isGranted ->
                  if (isGranted) {
                      startListeningInternal()
                  } else {
                      Toast.makeText(this, "دسترسی میکروفون داده نشد", Toast.LENGTH_SHORT).show()
                      notifyServiceCanceled()
                      finish()
                  }
              }

              private val fallbackLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK && result.data != null) {
                      val spoken = result.data?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)?.getOrNull(0) ?: ""
                      if (spoken.isNotBlank()) {
                          sendResultToService(spoken)
                          return@registerForActivityResult
                      }
                  }
                  notifyServiceCanceled()
                  finish()
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_voice_input)

                  tvStatus = findViewById(R.id.tvVoiceStatus)
                  tvLang = findViewById(R.id.tvVoiceLang)
                  val btnCancel = findViewById<Button>(R.id.btnVoiceCancel)

                  speechLangTag = intent.getStringExtra(EXTRA_SPEECH_TAG) ?: "tr-TR"
                  val langName = intent.getStringExtra(EXTRA_LANG_NAME) ?: "Turkish"
                  tvLang.text = "زبان گفتار: $langName ($speechLangTag)"

                  btnCancel.setOnClickListener {
                      notifyServiceCanceled()
                      finish()
                  }

                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                      startListeningInternal()
                  } else {
                      micPermissionLauncher.launch(Manifest.permission.RECORD_AUDIO)
                  }
              }

              private fun startListeningInternal() {
                  if (SpeechRecognizer.isRecognitionAvailable(this)) {
                      speechRecognizer?.destroy()
                      speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)
                      speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                          override fun onReadyForSpeech(params: Bundle?) {
                              tvStatus.text = "در حال شنیدن گفتار شما..."
                          }
                          override fun onBeginningOfSpeech() {
                              tvStatus.text = "در حال دریافت صدا..."
                          }
                          override fun onResults(results: Bundle?) {
                              val heard = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.getOrNull(0) ?: ""
                              if (heard.isNotBlank()) {
                                  sendResultToService(heard)
                              } else {
                                  notifyServiceCanceled()
                                  finish()
                              }
                          }
                          override fun onError(error: Int) {
                              // در صورت خطای سرور گوگل، یک بار با Intent سیستمی تست می‌کنیم
                              launchFallbackIntent()
                          }
                          override fun onRmsChanged(rmsdB: Float) {}
                          override fun onBufferReceived(buffer: ByteArray?) {}
                          override fun onEndOfSpeech() {
                              tvStatus.text = "در حال پردازش گفتار..."
                          }
                          override fun onPartialResults(partialResults: Bundle?) {}
                          override fun onEvent(eventType: Int, params: Bundle?) {}
                      })

                      val intent = createSpeechIntent(speechLangTag)
                      speechRecognizer?.startListening(intent)
                  } else {
                      launchFallbackIntent()
                  }
              }

              private fun launchFallbackIntent() {
                  try {
                      val intent = createSpeechIntent(speechLangTag)
                      fallbackLauncher.launch(intent)
                  } catch (e: Exception) {
                      Toast.makeText(this, "سرویس تشخیص گفتار گوگل در دسترس نیست", Toast.LENGTH_SHORT).show()
                      notifyServiceCanceled()
                      finish()
                  }
              }

              private fun createSpeechIntent(langTag: String): Intent {
                  return Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, langTag)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, langTag)
                      putExtra("android.speech.extra.EXTRA_ADDITIONAL_LANGUAGES", arrayOf(langTag))
                      putExtra(RecognizerIntent.EXTRA_PROMPT, "در حال شنیدن گفتار...")
                      putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 3)
                  }
              }

              private fun sendResultToService(text: String) {
                  val serviceIntent = Intent(this, FloatingWidgetService::class.java).apply {
                      action = FloatingWidgetService.ACTION_VOICE_RESULT
                      putExtra(FloatingWidgetService.EXTRA_VOICE_TEXT, text)
                  }
                  startService(serviceIntent)
                  finish()
              }

              private fun notifyServiceCanceled() {
                  val serviceIntent = Intent(this, FloatingWidgetService::class.java).apply {
                      action = FloatingWidgetService.ACTION_VOICE_CANCEL
                  }
                  startService(serviceIntent)
              }

              override fun onDestroy() {
                  super.onDestroy()
                  speechRecognizer?.destroy()
              }

              companion object {
                  const val EXTRA_SPEECH_TAG = "extra_speech_tag"
                  const val EXTRA_LANG_NAME = "extra_lang_name"
              }
          }
