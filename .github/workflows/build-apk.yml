                  android:supportsRtl="true"
                  android:theme="@style/Theme.FloatingTranslator">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".FloatingWidgetService"
                      android:enabled="true"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          # TranslatorHelper.kt (پشتیبانی از گوگل ترنسلیت و هوش مصنوعی جمینای)
          cat << 'EOF' > app/src/main/java/com/example/translator/TranslatorHelper.kt
          package com.example.translator
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          import java.net.URLEncoder

          object TranslatorHelper {

              // ترجمه مستقیم و سریع گوگل بدون نیاز به کلید
              suspend fun translate(text: String, from: String, to: String): String {
                  return withContext(Dispatchers.IO) {
                      try {
                          val encodedText = URLEncoder.encode(text, "UTF-8")
                          val urlString = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=$from&tl=$to&dt=t&q=$encodedText"
                          val conn = URL(urlString).openConnection() as HttpURLConnection
                          conn.requestMethod = "GET"
                          conn.setRequestProperty("User-Agent", "Mozilla/5.0")
                          val response = conn.inputStream.bufferedReader().use { it.readText() }
                          val jsonArray = JSONArray(response)
                          val sentences = jsonArray.getJSONArray(0)
                          val result = StringBuilder()
                          for (i in 0 until sentences.length()) {
                              result.append(sentences.getJSONArray(i).getString(0))
                          }
                          result.toString()
                      } catch (e: Exception) {
                          "خطا در ترجمه سریع: ${e.localizedMessage}"
                      }
                  }
              }

              // ترجمه و تحلیل هوشمند با Google Gemini AI
              suspend fun askGemini(text: String, fromLang: String, toLang: String, apiKey: String): String {
                  return withContext(Dispatchers.IO) {
                      try {
                          val prompt = "You are an expert multilingual AI translator and assistant. " +
                                  "Translate the following text from $fromLang to $toLang with natural fluency. " +
                                  "If there are any idioms, slang, or context, briefly explain them. " +
                                  "If the input is a question or request, fulfill it directly in $toLang.\n\nInput: \"$text\""

                          val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=$apiKey")
                          val conn = url.openConnection() as HttpURLConnection
                          conn.requestMethod = "POST"
                          conn.setRequestProperty("Content-Type", "application/json")
                          conn.doOutput = true

                          val rootJson = JSONObject().apply {
                              put("contents", JSONArray().apply {
                                  put(JSONObject().apply {
                                      put("parts", JSONArray().apply {
                                          put(JSONObject().apply {
                                              put("text", prompt)
                                          })
                                      })
                                  })
                              })
                          }

                          conn.outputStream.use { it.write(rootJson.toString().toByteArray(Charsets.UTF_8)) }

                          if (conn.responseCode == 200) {
                              val response = conn.inputStream.bufferedReader().use { it.readText() }
                              val json = JSONObject(response)
                              val candidates = json.getJSONArray("candidates")
                              val content = candidates.getJSONObject(0).getJSONObject("content")
                              val parts = content.getJSONArray("parts")
                              parts.getJSONObject(0).getString("text").trim()
                          } else {
                              val errorMsg = conn.errorStream?.bufferedReader()?.use { it.readText() } ?: ""
                              "خطا در ارتباط با هوش مصنوعی (کد ${conn.responseCode}). لطفاً کلید API را بررسی کنید."
                          }
                      } catch (e: Exception) {
                          "خطا در ارتباط با هوش مصنوعی: ${e.localizedMessage}"
                      }
                  }
              }
          }
          EOF

          # FloatingWidgetService.kt
          cat << 'EOF' > app/src/main/java/com/example/translator/FloatingWidgetService.kt
          package com.example.translator
          import android.annotation.SuppressLint
          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.os.*
          import android.speech.*
          import android.view.*
          import android.widget.*
          import androidx.core.app.NotificationCompat
          import kotlinx.coroutines.*
          import java.util.*
          import kotlin.math.abs

          class FloatingWidgetService : Service() {
              private lateinit var windowManager: WindowManager
              private lateinit var floatingView: View
              private lateinit var params: WindowManager.LayoutParams
              private var speechRecognizer: SpeechRecognizer? = null

              private val langNames = listOf("انگلیسی", "فارسی", "ترکی", "عربی", "روسی")
              private val langCodes = mapOf(
                  "انگلیسی" to "en",
                  "فارسی" to "fa",
                  "ترکی" to "tr",
                  "عربی" to "ar",
                  "روسی" to "ru"
              )
              private val speechCodes = mapOf(
                  "en" to "en-US",
                  "fa" to "fa-IR",
                  "tr" to "tr-TR",
                  "ar" to "ar-SA",
                  "ru" to "ru-RU"
              )

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  startForegroundNotification()

                  windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                  floatingView = LayoutInflater.from(this).inflate(R.layout.floating_widget_layout, null)

                  val layoutType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  } else {
                      @Suppress("DEPRECATION")
                      WindowManager.LayoutParams.TYPE_PHONE
                  }

                  params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      layoutType,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = 60
                      y = 180
                  }

                  windowManager.addView(floatingView, params)
                  setupFloatingLogic()
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun setupFloatingLogic() {
                  val collapsed = floatingView.findViewById<View>(R.id.layout_collapsed)
                  val expanded = floatingView.findViewById<View>(R.id.layout_expanded)
                  val headerDrag = floatingView.findViewById<View>(R.id.layout_header_drag)

                  val btnMinimize = floatingView.findViewById<TextView>(R.id.btnMinimize)
                  val btnCloseApp = floatingView.findViewById<TextView>(R.id.btnCloseApp)

                  val spinnerSource = floatingView.findViewById<Spinner>(R.id.spinnerSource)
                  val spinnerTarget = floatingView.findViewById<Spinner>(R.id.spinnerTarget)
                  val btnSwapLang = floatingView.findViewById<ImageView>(R.id.btnSwapLang)

                  val etInput = floatingView.findViewById<EditText>(R.id.etInput)
                  val btnTranslate = floatingView.findViewById<Button>(R.id.btnTranslate)
                  val btnAi = floatingView.findViewById<Button>(R.id.btnAi)
                  val btnMic = floatingView.findViewById<Button>(R.id.btnMic)
                  val tvResult = floatingView.findViewById<TextView>(R.id.tvResult)
                  val btnCopy = floatingView.findViewById<Button>(R.id.btnCopy)

                  val adapter = ArrayAdapter(this, android.R.layout.simple_spinner_dropdown_item, langNames)
                  spinnerSource.adapter = adapter
                  spinnerTarget.adapter = adapter
                  spinnerSource.setSelection(0)
                  spinnerTarget.setSelection(1)

                  btnSwapLang.setOnClickListener {
                      val currentSource = spinnerSource.selectedItemPosition
                      val currentTarget = spinnerTarget.selectedItemPosition
                      spinnerSource.setSelection(currentTarget)
                      spinnerTarget.setSelection(currentSource)
                  }

                  collapsed.setOnClickListener {
                      collapsed.visibility = View.GONE
                      expanded.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnMinimize.setOnClickListener {
                      expanded.visibility = View.GONE
                      collapsed.visibility = View.VISIBLE
                      params.flags = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE
                      windowManager.updateViewLayout(floatingView, params)
                  }

                  btnCloseApp.setOnClickListener {
                      Toast.makeText(this, "مترجم هوشمند متوقف شد", Toast.LENGTH_SHORT).show()
                      stopSelf()
                  }

                  // ترجمه سریع و کلاسیک
                  btnTranslate.setOnClickListener {
                      val text = etInput.text.toString().trim()
                      if (text.isNotEmpty()) {
                          val srcLang = langCodes[spinnerSource.selectedItem.toString()] ?: "en"
                          val targetLang = langCodes[spinnerTarget.selectedItem.toString()] ?: "fa"
                          tvResult.text = "در حال ترجمه سریع..."
                          CoroutineScope(Dispatchers.Main).launch {
                              tvResult.text = TranslatorHelper.translate(text, srcLang, targetLang)
                          }
                      }
                  }

                  // تحلیل عمیق و پاسخ با هوش مصنوعی Gemini
                  btnAi.setOnClickListener {
                      val text = etInput.text.toString().trim()
                      if (text.isEmpty()) {
                          Toast.makeText(this, "لطفاً ابتدا متنی وارد کنید", Toast.LENGTH_SHORT).show()
                          return@setOnClickListener
                      }

                      val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                      val apiKey = prefs.getString("gemini_api_key", "") ?: ""

                      if (apiKey.isBlank()) {
                          tvResult.text = "⚠️ کلید هوش مصنوعی ثبت نشده است!\nلطفاً برنامه اصلی را باز کنید و Gemini API Key خود را وارد کنید."
                          return@setOnClickListener
                      }

                      val srcLang = spinnerSource.selectedItem.toString()
                      val targetLang = spinnerTarget.selectedItem.toString()

                      tvResult.text = "🤖 هوش مصنوعی در حال تحلیل و ترجمه عمیق..."
                      CoroutineScope(Dispatchers.Main).launch {
                          tvResult.text = TranslatorHelper.askGemini(text, srcLang, targetLang, apiKey)
                      }
                  }

                  btnCopy.setOnClickListener {
                      val result = tvResult.text.toString()
                      if (result.isNotEmpty()) {
                          val clipboard = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          clipboard.setPrimaryClip(ClipData.newPlainText("Result", result))
                          Toast.makeText(this, "متن کپی شد", Toast.LENGTH_SHORT).show()
                      }
                  }

                  btnMic.setOnClickListener {
                      val srcCode = langCodes[spinnerSource.selectedItem.toString()] ?: "en"
                      val speechLocale = speechCodes[srcCode] ?: "en-US"
                      startListening(speechLocale, etInput, tvResult, spinnerSource, spinnerTarget)
                  }

                  attachDragListener(collapsed)
                  attachDragListener(headerDrag)
              }

              private fun startListening(
                  localeTag: String,
                  etInput: EditText,
                  tvResult: TextView,
                  spinnerSource: Spinner,
                  spinnerTarget: Spinner
              ) {
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      Toast.makeText(this, "موتور تشخیص صوت فعال نیست", Toast.LENGTH_SHORT).show()
                      return
                  }
                  speechRecognizer?.destroy()
                  speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this)

                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, localeTag)
                  }

                  speechRecognizer?.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) { tvResult.text = "در حال شنیدن گفتار..." }
                      override fun onResults(results: Bundle?) {
                          val matches = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                          if (!matches.isNullOrEmpty()) {
                              val heard = matches[0]
                              etInput.setText(heard)
                              val srcLang = langCodes[spinnerSource.selectedItem.toString()] ?: "en"
                              val targetLang = langCodes[spinnerTarget.selectedItem.toString()] ?: "fa"
                              CoroutineScope(Dispatchers.Main).launch {
                                  tvResult.text = "در حال ترجمه سریع..."
                                  tvResult.text = TranslatorHelper.translate(heard, srcLang, targetLang)
                              }
                          }
                      }
                      override fun onError(error: Int) { tvResult.text = "صدا واضح نبود یا دریافت نشد." }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  speechRecognizer?.startListening(intent)
              }

              @SuppressLint("ClickableViewAccessibility")
              private fun attachDragListener(view: View) {
                  var initialX = 0
                  var initialY = 0
                  var initialTouchX = 0f
                  var initialTouchY = 0f
                  view.setOnTouchListener { _, event ->
                      when (event.action) {
                          MotionEvent.ACTION_DOWN -> {
                              initialX = params.x
                              initialY = params.y
                              initialTouchX = event.rawX
                              initialTouchY = event.rawY
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              params.x = initialX + (event.rawX - initialTouchX).toInt()
                              params.y = initialY + (event.rawY - initialTouchY).toInt()
                              windowManager.updateViewLayout(floatingView, params)
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (abs(event.rawX - initialTouchX) < 10 && abs(event.rawY - initialTouchY) < 10) {
                                  view.performClick()
                              }
                              true
                          }
                          else -> false
                      }
                  }
              }

              private fun startForegroundNotification() {
                  val channelId = "floating_translator_channel"
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val channel = NotificationChannel(channelId, "مترجم شناور AI", NotificationManager.IMPORTANCE_LOW)
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
                  val notification: Notification = NotificationCompat.Builder(this, channelId)
                      .setContentTitle("مترجم هوشمند فعال است")
                      .setContentText("روی حباب بنفش/آبی کلیک کنید")
                      .setSmallIcon(R.drawable.ic_app_icon)
                      .build()

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      startForeground(1, notification, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else {
                      startForeground(1, notification)
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  speechRecognizer?.destroy()
                  if (::floatingView.isInitialized) {
                      windowManager.removeView(floatingView)
                  }
              }
          }
          EOF

          # MainActivity.kt (ذخیره کلید API و هدایت به سرویس)
          cat << 'EOF' > app/src/main/java/com/example/translator/MainActivity.kt
          package com.example.translator
          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.EditText
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                  val etApiKey = findViewById<EditText>(R.id.etApiKey)
                  val btnSaveApiKey = findViewById<Button>(R.id.btnSaveApiKey)
                  val btnStart = findViewById<Button>(R.id.btnStartFloating)

                  etApiKey.setText(prefs.getString("gemini_api_key", ""))

                  btnSaveApiKey.setOnClickListener {
                      val key = etApiKey.text.toString().trim()
                      prefs.edit().putString("gemini_api_key", key).apply()
                      Toast.makeText(this, "کلید با موفقیت در حافظه دستگاه ذخیره شد", Toast.LENGTH_SHORT).show()
                  }

                  btnStart.setOnClickListener {
                      checkPermissionsAndStart()
                  }
              }

              private fun checkPermissionsAndStart() {
                  if (!Settings.canDrawOverlays(this)) {
                      val intent = Intent(
                          Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                          Uri.parse("package:$packageName")
                      )
                      startActivity(intent)
                      Toast.makeText(this, "دسترسی نمایش روی سایر برنامه‌ها را فعال کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                      return
                  }
                  val serviceIntent = Intent(this, FloatingWidgetService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(serviceIntent)
                  } else {
                      startService(serviceIntent)
                  }
                  finish()
              }
          }
