name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      - name: Generate Complete Clean Project
        run: |
          rm -rf app/src settings.gradle build.gradle gradle.properties local.properties

          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.nonTransitiveRClass=false" >> gradle.properties

          # settings.gradle
          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "EminTranslate"
          include ':app'
          EOF

          # root build.gradle
          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          # app/build.gradle
          mkdir -p app
          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.example.translator'
              compileSdk 34
              defaultConfig {
                  applicationId "com.example.translator"
                  minSdk 29
                  targetSdk 34
                  versionCode 10
                  versionName "10.0-Optimized"
              }
              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }
          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/res/layout
          mkdir -p app/src/main/java/com/example/translator

          # themes.xml
          cat << 'EOF' > app/src/main/res/values/themes.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.EminTranslate" parent="Theme.MaterialComponents.DayNight.NoActionBar">
                  <item name="colorPrimary">#A8C7FA</item>
                  <item name="colorPrimaryVariant">#0F1015</item>
                  <item name="colorOnPrimary">#003258</item>
                  <item name="android:statusBarColor">#0F1015</item>
                  <item name="android:navigationBarColor">#0F1015</item>
              </style>
              <style name="Theme.VoiceDialog" parent="Theme.AppCompat.Dialog">
                  <item name="android:windowBackground">@android:color/transparent</item>
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowIsFloating">true</item>
                  <item name="android:backgroundDimEnabled">true</item>
              </style>
          </resources>
          EOF

          # drawables
          cat << 'EOF' > app/src/main/res/drawable/bg_dark_card.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1C22" />
              <corners android:radius="24dp" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_chip.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#24262E" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#363942" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_lang_pill.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1F2128" />
              <corners android:radius="14dp" />
              <stroke android:width="1dp" android:color="#363942" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_circle_button.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#1F2128" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_mic_fab.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#A8C7FA" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_bubble.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <solid android:color="#A8C7FA" />
              <stroke android:width="2dp" android:color="#FFFFFF" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/bg_window.xml
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#1A1C22" />
              <corners android:radius="20dp" />
              <stroke android:width="1dp" android:color="#363942" />
          </shape>
          EOF

          cat << 'EOF' > app/src/main/res/drawable/ic_app_icon.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path
                  android:fillColor="#A8C7FA"
                  android:pathData="M12.87,15.07l-2.54,-2.51.03,-.03c1.74,-1.94 2.98,-4.17 3.71,-6.53H17V4h-7V2H8v2H1v1.99h11.17C11.5,7.92 10.44,9.75 9,11.35 8.07,10.32 7.3,9.19 6.69,8h-2c.73,1.63 1.73,3.17 2.98,4.56l-5.11,5.02L4,19l5,-5 3.11,3.11.76,-2.04zM18.5,10h-2L12,22h2l1.12,-3h4.75L21,22h2l-4.5,-12zm-2.62,7l1.62,-4.33L19.12,17h-3.24z"/>
          </vector>
          EOF

          # activity_main.xml
          cat << 'EOF' > app/src/main/res/layout/activity_main.xml
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#0F1015"
              android:paddingHorizontal="16dp"
              android:paddingTop="16dp"
              android:paddingBottom="24dp">

              <RelativeLayout
                  android:id="@+id/layoutTopBar"
                  android:layout_width="match_parent"
                  android:layout_height="48dp">

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_alignParentStart="true"
                      android:layout_centerVertical="true"
                      android:text="★"
                      android:textColor="#E2E2E6"
                      android:textSize="22sp" />

                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_centerInParent="true"
                      android:text="Emin Translate"
                      android:textColor="#E2E2E6"
                      android:textSize="19sp"
                      android:textStyle="bold" />
              </RelativeLayout>

              <ScrollView
                  android:id="@+id/scrollArea"
                  android:layout_width="match_parent"
                  android:layout_height="match_parent"
                  android:layout_above="@id/layoutBottomSection"
                  android:layout_below="@id/layoutTopBar"
                  android:layout_marginTop="16dp"
                  android:fillViewport="true">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical">

                      <EditText
                          android:id="@+id/etTranslateInput"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:minHeight="90dp"
                          android:background="@null"
                          android:gravity="top|start"
                          android:hint="متن را تایپ یا صحبت کنید..."
                          android:textColor="#FFFFFF"
                          android:textColorHint="#6C707A"
                          android:textSize="20sp" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="6dp"
                          android:orientation="horizontal">

                          <LinearLayout
                              android:id="@+id/btnPasteChip"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:background="@drawable/bg_chip"
                              android:gravity="center_vertical"
                              android:paddingHorizontal="16dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="📋  Paste"
                                  android:textColor="#E2E2E6"
                                  android:textSize="14sp"
                                  android:textStyle="bold" />
                          </LinearLayout>

                          <LinearLayout
                              android:id="@+id/btnClearChip"
                              android:layout_width="wrap_content"
                              android:layout_height="38dp"
                              android:layout_marginStart="8dp"
                              android:background="@drawable/bg_chip"
                              android:gravity="center_vertical"
                              android:paddingHorizontal="16dp">

                              <TextView
                                  android:layout_width="wrap_content"
                                  android:layout_height="wrap_content"
                                  android:text="✕  پاک کردن"
                                  android:textColor="#9AA0A6"
                                  android:textSize="14sp" />
                          </LinearLayout>
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/cardResult"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:layout_marginTop="20dp"
                          android:background="@drawable/bg_dark_card"
                          android:orientation="vertical"
                          android:padding="16dp"
                          android:visibility="gone">

                          <TextView
                              android:id="@+id/tvTranslationResult"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#A8C7FA"
                              android:textSize="18sp"
                              android:lineSpacingExtra="4dp" />

                          <LinearLayout
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:gravity="end|center_vertical"
                              android:layout_marginTop="14dp">

                              <Button
                                  android:id="@+id/btnSpeakResult"
                                  android:layout_width="wrap_content"
                                  android:layout_height="36dp"
                                  android:backgroundTint="#A8C7FA"
                                  android:text="🔊 تلفظ صوتی"
                                  android:textColor="#003258"
                                  android:textSize="11sp" />

                              <Button
                                  android:id="@+id/btnCopyResult"
                                  android:layout_width="wrap_content"
                                  android:layout_height="36dp"
                                  android:layout_marginStart="8dp"
                                  android:backgroundTint="#24262E"
                                  android:text="کپی متن"
                                  android:textColor="#E2E2E6"
                                  android:textSize="11sp" />
                          </LinearLayout>
                      </LinearLayout>
                  </LinearLayout>
              </ScrollView>

              <LinearLayout
                  android:id="@+id/layoutBottomSection"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:orientation="vertical">

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="54dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnSourceLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Turkish"
                          android:textColor="#E2E2E6"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/btnSwapLang"
                          android:layout_width="48dp"
                          android:layout_height="48dp"
                          android:gravity="center"
                          android:text="⇄"
                          android:textColor="#A8C7FA"
                          android:textSize="22sp" />

                      <TextView
                          android:id="@+id/btnTargetLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Persian"
                          android:textColor="#E2E2E6"
                          android:textSize="15sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="18dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <LinearLayout
                          android:id="@+id/btnToggleFloating"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:gravity="center"
                          android:orientation="vertical">

                          <TextView
                              android:layout_width="56dp"
                              android:layout_height="56dp"
                              android:background="@drawable/bg_circle_button"
                              android:gravity="center"
                              android:text="🪟"
                              android:textSize="22sp" />

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:layout_marginTop="6dp"
                              android:text="پنجره شناور"
                              android:textColor="#A0A4AE"
                              android:textSize="12sp" />
                      </LinearLayout>

                      <LinearLayout
                          android:id="@+id/btnMainMic"
                          android:layout_width="74dp"
                          android:layout_height="74dp"
                          android:background="@drawable/bg_mic_fab"
                          android:elevation="6dp"
                          android:gravity="center">

                          <TextView
                              android:layout_width="wrap_content"
                              android:layout_height="wrap_content"
                              android:text="🎙"
                              android:textSize="28sp" />
                      </LinearLayout>

                      <View
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="1dp" />
                  </LinearLayout>
              </LinearLayout>
          </RelativeLayout>
          EOF

          # floating_widget_layout.xml
          cat << 'EOF' > app/src/main/res/layout/floating_widget_layout.xml
          <?xml version="1.0" encoding="utf-8"?>
          <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/root_container"
              android:layout_width="wrap_content"
              android:layout_height="wrap_content">

              <LinearLayout
                  android:id="@+id/layout_collapsed"
                  android:layout_width="56dp"
                  android:layout_height="56dp"
                  android:background="@drawable/bg_bubble"
                  android:gravity="center"
                  android:elevation="8dp">
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:text="ET"
                      android:textColor="#003258"
                      android:textSize="18sp"
                      android:textStyle="bold" />
              </LinearLayout>

              <LinearLayout
                  android:id="@+id/layout_expanded"
                  android:layout_width="330dp"
                  android:layout_height="wrap_content"
                  android:background="@drawable/bg_window"
                  android:orientation="vertical"
                  android:padding="12dp"
                  android:elevation="12dp"
                  android:visibility="gone">

                  <!-- Header -->
                  <LinearLayout
                      android:id="@+id/layout_header_drag"
                      android:layout_width="match_parent"
                      android:layout_height="34dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="wrap_content"
                          android:text="Emin Translate"
                          android:textColor="#A8C7FA"
                          android:textSize="13sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/btnMinimize"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:gravity="center"
                          android:text="—"
                          android:textColor="#9AA0A6"
                          android:textSize="15sp" />

                      <TextView
                          android:id="@+id/btnCloseApp"
                          android:layout_width="32dp"
                          android:layout_height="32dp"
                          android:gravity="center"
                          android:text="✕"
                          android:textColor="#F28B82"
                          android:textSize="15sp" />
                  </LinearLayout>

                  <!-- Language Bar -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="36dp"
                      android:layout_marginTop="6dp"
                      android:gravity="center_vertical"
                      android:orientation="horizontal">

                      <TextView
                          android:id="@+id/btnFloatSourceLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Turkish"
                          android:textColor="#E2E2E6"
                          android:textSize="12sp"
                          android:textStyle="bold" />

                      <TextView
                          android:id="@+id/btnFloatSwapLang"
                          android:layout_width="34dp"
                          android:layout_height="34dp"
                          android:gravity="center"
                          android:text="⇄"
                          android:textColor="#A8C7FA"
                          android:textSize="18sp" />

                      <TextView
                          android:id="@+id/btnFloatTargetLang"
                          android:layout_width="0dp"
                          android:layout_weight="1"
                          android:layout_height="match_parent"
                          android:background="@drawable/bg_lang_pill"
                          android:gravity="center"
                          android:text="Persian"
                          android:textColor="#E2E2E6"
                          android:textSize="12sp"
                          android:textStyle="bold" />
                  </LinearLayout>

                  <!-- Input & Buttons -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:background="@drawable/bg_dark_card"
                      android:orientation="vertical"
                      android:padding="8dp">

                      <EditText
                          android:id="@+id/etInput"
                          android:layout_width="match_parent"
                          android:layout_height="60dp"
                          android:background="@null"
                          android:gravity="top|start"
                          android:hint="تایپ یا لمس دکمه گفتار..."
                          android:textSize="13sp"
                          android:textColor="#FFFFFF"
                          android:textColorHint="#6C707A" />

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="34dp"
                          android:gravity="end|center_vertical"
                          android:orientation="horizontal">

                          <Button
                              android:id="@+id/btnMic"
                              android:layout_width="wrap_content"
                              android:layout_height="32dp"
                              android:backgroundTint="#A8C7FA"
                              android:textColor="#003258"
                              android:text="🎙 گفتار"
                              android:textSize="11sp" />

                          <Button
                              android:id="@+id/btnTranslate"
                              android:layout_width="wrap_content"
                              android:layout_height="32dp"
                              android:layout_marginStart="6dp"
                              android:backgroundTint="#24262E"
                              android:textColor="#E2E2E6"
                              android:text="ترجمه"
                              android:textSize="11sp" />
                      </LinearLayout>
                  </LinearLayout>

                  <!-- Results -->
                  <LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:layout_marginTop="8dp"
                      android:orientation="vertical">

                      <ScrollView
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:maxHeight="90dp">

                          <TextView
                              android:id="@+id/tvResult"
                              android:layout_width="match_parent"
                              android:layout_height="wrap_content"
                              android:textColor="#A8C7FA"
                              android:textSize="13sp"
                              android:text="ترجمه اینجا نمایش داده می‌شود..." />
                      </ScrollView>

                      <LinearLayout
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:gravity="end|center_vertical"
                          android:layout_marginTop="4dp">

                          <TextView
                              android:id="@+id/btnFloatSpeak"
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:gravity="center"
                              android:text="🔊"
                              android:textSize="15sp" />

                          <TextView
                              android:id="@+id/btnFloatCopy"
                              android:layout_width="32dp"
                              android:layout_height="32dp"
                              android:layout_marginStart="6dp"
                              android:gravity="center"
                              android:text="📋"
                              android:textSize="15sp" />
                      </LinearLayout>
                  </LinearLayout>
              </LinearLayout>
          </FrameLayout>
          EOF

          # activity_voice_input.xml
          cat << 'EOF' > app/src/main/res/layout/activity_voice_input.xml
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:background="@drawable/bg_dark_card"
              android:gravity="center"
              android:orientation="vertical"
              android:padding="24dp">

              <TextView
                  android:id="@+id/tvVoiceTitle"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="🎙 در حال شنیدن گفتار..."
                  android:textColor="#A8C7FA"
                  android:textSize="18sp"
                  android:textStyle="bold" />

              <TextView
                  android:id="@+id/tvVoiceLang"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:text="زبان: Turkish"
                  android:textColor="#9AA0A6"
                  android:textSize="14sp" />

              <TextView
                  android:id="@+id/tvVoiceStatus"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="16dp"
                  android:text="لطفاً صحبت کنید..."
                  android:textColor="#FFFFFF"
                  android:textSize="15sp" />

              <Button
                  android:id="@+id/btnVoiceCancel"
                  android:layout_width="wrap_content"
                  android:layout_height="38dp"
                  android:layout_marginTop="20dp"
                  android:backgroundTint="#24262E"
                  android:text="انصراف"
                  android:textColor="#E2E2E6"
                  android:textSize="13sp" />
          </LinearLayout>
          EOF

          # AndroidManifest.xml
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.action.RECOGNIZE_SPEECH" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@drawable/ic_app_icon"
                  android:label="Emin Translate"
                  android:roundIcon="@drawable/ic_app_icon"
                  android:supportsRtl="false"
                  android:theme="@style/Theme.EminTranslate">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
