          # MainActivity.kt
          cat << 'EOF' > app/src/main/java/com/example/translator/MainActivity.kt
          package com.example.translator

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.*
          import android.content.pm.PackageManager
          import android.media.*
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.*
          import android.provider.Settings
          import android.speech.*
          import android.view.View
          import android.widget.*
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AlertDialog
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import kotlinx.coroutines.*
          import java.io.ByteArrayOutputStream

          class MainActivity : AppCompatActivity() {

              private val languages = listOf("Turkish", "Persian", "English", "Arabic", "Russian", "German", "French")
              private val langCodes = mapOf(
                  "Turkish" to "tr", "Persian" to "fa", "English" to "en",
                  "Arabic" to "ar", "Russian" to "ru", "German" to "de", "French" to "fr"
              )

              private var sourceLang = "Turkish"
              private var targetLang = "Persian"

              private lateinit var etInput: EditText
              private lateinit var cardResult: View
              private lateinit var tvResult: TextView
              private lateinit var btnSourceLang: TextView
              private lateinit var btnTargetLang: TextView

              private var mediaProjectionManager: MediaProjectionManager? = null

              private val screenCaptureLauncher = registerForActivityResult(
                  ActivityResultContracts.StartActivityForResult()
              ) { result ->
                  if (result.resultCode == RESULT_OK && result.data != null) {
                      val mp = mediaProjectionManager?.getMediaProjection(result.resultCode, result.data!!)
                      if (mp != null) {
                          startInternalAudioCapture(mp)
                      }
                  } else {
                      Toast.makeText(this, "دسترسی ضبط صدای داخلی تایید نشد", Toast.LENGTH_SHORT).show()
                  }
              }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)

                  mediaProjectionManager = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager

                  etInput = findViewById(R.id.etTranslateInput)
                  cardResult = findViewById(R.id.cardResult)
                  tvResult = findViewById(R.id.tvTranslationResult)
                  btnSourceLang = findViewById(R.id.btnSourceLang)
                  btnTargetLang = findViewById(R.id.btnTargetLang)

                  findViewById<View>(R.id.btnSettingsKey).setOnClickListener { showSettingsDialog() }
                  findViewById<View>(R.id.btnPasteChip).setOnClickListener { handlePaste() }
                  findViewById<View>(R.id.btnSwapLang).setOnClickListener { swapLanguages() }

                  btnSourceLang.setOnClickListener { showLanguagePicker(true) }
                  btnTargetLang.setOnClickListener { showLanguagePicker(false) }

                  findViewById<View>(R.id.btnCopyResult).setOnClickListener {
                      val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      clip.setPrimaryClip(ClipData.newPlainText("Translation", tvResult.text))
                      Toast.makeText(this, "متن کپی شد", Toast.LENGTH_SHORT).show()
                  }

                  // دکمه باز کردن ویجت شناور
                  findViewById<View>(R.id.btnToggleFloating).setOnClickListener {
                      checkOverlayAndStartService()
                  }

                  // دکمه میکروفون فیزیکی (گفتار معمولی)
                  findViewById<View>(R.id.btnMainMic).setOnClickListener {
                      checkMicAndListen()
                  }

                  // دکمه صدای داخلی (فیلم، بازی و...)
                  findViewById<View>(R.id.btnInternalAudio).setOnClickListener {
                      requestInternalAudioCapture()
                  }
              }

              private fun handlePaste() {
                  val clip = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  val text = clip.primaryClip?.getItemAt(0)?.text?.toString() ?: ""
                  if (text.isNotBlank()) {
                      etInput.setText(text)
                      performTranslation(text)
                  } else {
                      Toast.makeText(this, "متنی در حافظه کپی نشده است", Toast.LENGTH_SHORT).show()
                  }
              }

              private fun performTranslation(text: String) {
                  cardResult.visibility = View.VISIBLE
                  tvResult.text = "در حال ترجمه..."
                  val src = langCodes[sourceLang] ?: "auto"
                  val trg = langCodes[targetLang] ?: "fa"
                  CoroutineScope(Dispatchers.Main).launch {
                      tvResult.text = TranslatorHelper.translate(text, src, trg)
                  }
              }

              private fun swapLanguages() {
                  val temp = sourceLang
                  sourceLang = targetLang
                  targetLang = temp
                  btnSourceLang.text = sourceLang
                  btnTargetLang.text = targetLang
                  val currentText = etInput.text.toString().trim()
                  if (currentText.isNotEmpty()) performTranslation(currentText)
              }

              private fun showLanguagePicker(isSource: Boolean) {
                  AlertDialog.Builder(this)
                      .setTitle("انتخاب زبان")
                      .setItems(languages.toTypedArray()) { _, which ->
                          if (isSource) {
                              sourceLang = languages[which]
                              btnSourceLang.text = sourceLang
                          } else {
                              targetLang = languages[which]
                              btnTargetLang.text = targetLang
                          }
                      }.show()
              }

              private fun showSettingsDialog() {
                  val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                  val currentKey = prefs.getString("gemini_api_key", "")

                  val input = EditText(this).apply {
                      hint = "AIzaSy..."
                      setText(currentKey)
                      setPadding(40, 30, 40, 30)
                  }

                  AlertDialog.Builder(this)
                      .setTitle("تنظیم کلید Gemini API")
                      .setMessage("برای ضبط صدای مستقیم فیلم و هوش مصنوعی، کلید رایگان Gemini خود را وارد کنید:")
                      .setView(input)
                      .setPositiveButton("ذخیره") { _, _ ->
                          val key = input.text.toString().trim()
                          prefs.edit().putString("gemini_api_key", key).apply()
                          Toast.makeText(this, "کلید با موفقیت ذخیره شد", Toast.LENGTH_SHORT).show()
                      }
                      .setNegativeButton("انصراف", null)
                      .show()
              }

              private fun checkOverlayAndStartService() {
                  if (!Settings.canDrawOverlays(this)) {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      Toast.makeText(this, "لطفاً دسترسی شناور را فعال کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 101)
                      return
                  }
                  val intent = Intent(this, FloatingWidgetService::class.java)
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
                  Toast.makeText(this, "مترجم شناور فعال شد", Toast.LENGTH_SHORT).show()
              }

              private fun checkMicAndListen() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      ActivityCompat.requestPermissions(this, arrayOf(Manifest.permission.RECORD_AUDIO), 102)
                      return
                  }
                  val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                      putExtra(RecognizerIntent.EXTRA_LANGUAGE, langCodes[sourceLang] ?: "tr")
                  }
                  val recognizer = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {
                          cardResult.visibility = View.VISIBLE
                          tvResult.text = "در حال شنیدن گفتار شما..."
                      }
                      override fun onResults(results: Bundle?) {
                          val heard = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.getOrNull(0) ?: ""
                          if (heard.isNotEmpty()) {
                              etInput.setText(heard)
                              performTranslation(heard)
                          }
                      }
                      override fun onError(error: Int) { tvResult.text = "صدایی دریافت نشد." }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  recognizer.startListening(intent)
              }

              // ضبط صدای مستقیم از پردازنده صوتی گوشی
              private fun requestInternalAudioCapture() {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) {
                      Toast.makeText(this, "ضبط صدای داخلی نیازمند اندروید ۱۰ به بالا است", Toast.LENGTH_LONG).show()
                      return
                  }
                  val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                  val key = prefs.getString("gemini_api_key", "") ?: ""
                  if (key.isBlank()) {
                      Toast.makeText(this, "ابتدا کلید Gemini API را از چرخ‌دنده بالا ثبت کنید", Toast.LENGTH_LONG).show()
                      return
                  }
                  screenCaptureLauncher.launch(mediaProjectionManager?.createScreenCaptureIntent())
              }

              @SuppressLint("MissingPermission")
              private fun startInternalAudioCapture(mediaProjection: MediaProjection) {
                  if (Build.VERSION.SDK_INT < Build.VERSION_CODES.Q) return

                  cardResult.visibility = View.VISIBLE
                  tvResult.text = "🔊 در حال ضبط ۵ ثانیه از صدای داخلی گوشی (ویدیو/موزیک)..."

                  CoroutineScope(Dispatchers.IO).launch {
                      try {
                          val sampleRate = 16000
                          val channelConfig = AudioFormat.CHANNEL_IN_MONO
                          val audioEncoding = AudioFormat.ENCODING_PCM_16BIT
                          val bufferSize = AudioRecord.getMinBufferSize(sampleRate, channelConfig, audioEncoding) * 4

                          val playbackConfig = AudioPlaybackCaptureConfiguration.Builder(mediaProjection)
                              .addMatchingUsage(AudioAttributes.USAGE_MEDIA)
                              .addMatchingUsage(AudioAttributes.USAGE_GAME)
                              .addMatchingUsage(AudioAttributes.USAGE_UNKNOWN)
                              .build()

                          val audioRecord = AudioRecord.Builder()
                              .setAudioPlaybackCaptureConfig(playbackConfig)
                              .setAudioFormat(
                                  AudioFormat.Builder()
                                      .setEncoding(audioEncoding)
                                      .setSampleRate(sampleRate)
                                      .setChannelMask(channelConfig)
                                      .build()
                              )
                              .setBufferSizeInBytes(bufferSize)
                              .build()

                          val outputStream = ByteArrayOutputStream()
                          val buffer = ByteArray(bufferSize)
                          audioRecord.startRecording()

                          val startTime = System.currentTimeMillis()
                          while (System.currentTimeMillis() - startTime < 5000) { // ضبط ۵ ثانیه‌ای
                              val read = audioRecord.read(buffer, 0, buffer.size)
                              if (read > 0) outputStream.write(buffer, 0, read)
                          }

                          audioRecord.stop()
                          audioRecord.release()
                          mediaProjection.stop()

                          val wavData = TranslatorHelper.pcmToWav(outputStream.toByteArray(), sampleRate, 1)

                          withContext(Dispatchers.Main) {
                              tvResult.text = "🤖 هوش مصنوعی در حال تحلیل و ترجمه صدای فیلم..."
                          }

                          val prefs = getSharedPreferences("translator_prefs", Context.MODE_PRIVATE)
                          val apiKey = prefs.getString("gemini_api_key", "") ?: ""
                          val response = TranslatorHelper.transcribeAndTranslateInternalAudio(wavData, targetLang, apiKey)

                          withContext(Dispatchers.Main) {
                              tvResult.text = response
                          }
                      } catch (e: Exception) {
                          withContext(Dispatchers.Main) {
                              tvResult.text = "خطا در ضبط صدای داخلی: ${e.localizedMessage}"
                          }
                      }
                  }
              }
          }
