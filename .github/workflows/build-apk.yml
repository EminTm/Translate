                          android:layout_marginBottom="6dp" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="کلید رایگان Gemini API خود را وارد کنید (اختیاری؛ برای تحلیل عمیق و هوشمند اصطلاحات و فیلم‌ها):"
