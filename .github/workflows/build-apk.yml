name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'

      # اصلاح خودکار تم و فایل‌های تنظیمات
      - name: Auto Fix Config & Licenses
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          echo "android.useAndroidX=true" > gradle.properties
          sed -i 's/Theme.Material3.DayNight.NoActionBar/Theme.MaterialComponents.DayNight.NoActionBar/g' app/src/main/AndroidManifest.xml || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # بررسی درستی مسیر فایل‌ها
      - name: Verify Project Files
        run: |
          echo "Checking files in app folder:"
          find app -type f

      # بیلد تمیز و بدون خطای برنامه
      - name: Build APK
        run: |
          gradle assembleDebug --console=plain --no-daemon

      # آپلود فایل دانلودی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Floating-Translator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
